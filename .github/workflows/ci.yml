name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            node: '26.5.0'
            platform: darwin-arm64
          - os: ubuntu-24.04
            node: '22.16.0'
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact dependency graph without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reviewed native flock binding
        run: npm rebuild fs-ext --foreground-scripts
      - name: Native, type, isolation, real Pi and fault tests
        env:
          PI_RELAY_REQUIRE_PLATFORM: ${{ matrix.platform }}
        run: npm run test:ci
      - name: Sixty-second real-Pi progress stress
        run: npm run test:stress
      - name: Package allowlist and local package smoke
        run: npm run pack:check && npm run test:package
      - name: Clean standalone consumer installation
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          tarball=$(npm pack --ignore-scripts --pack-destination "$scratch" --json | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((Array.isArray(o)?o:Object.values(o))[0].filename)')
          npm install --prefix "$scratch/consumer" --ignore-scripts --no-audit --no-fund "$scratch/$tarball"
          npm rebuild --prefix "$scratch/consumer" fs-ext --foreground-scripts
          "$scratch/consumer/node_modules/.bin/pi-relay" doctor
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-${{ matrix.platform }}
          path: artifacts/implementation/
          retention-days: 14
          if-no-files-found: ignore
